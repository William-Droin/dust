# Strategic-merge patches to mount the GCP service account JSON Secret into
# the Dust workloads.
#
# Usage (post-deploy):
#   kubectl apply -f gcp-deployment/cloudbuild/service-account-secret.yaml
#
# Notes:
# - This expects an existing Secret named `dust-gcp-sa` in the `dust-app` namespace
#   containing a key named `service-account.json`.
# - Mount path will be: /var/secrets/gcp/service-account.json
# - These patches are safe to apply multiple times (strategic merge by name).

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: dust-app
spec:
  template:
    spec:
      containers:
        - name: front
          env:
            - name: SERVICE_ACCOUNT
              value: "/var/secrets/gcp/service-account.json"
          volumeMounts:
            - name: gcp-sa
              mountPath: /var/secrets/gcp
              readOnly: true
      volumes:
        - name: gcp-sa
          secret:
            secretName: dust-gcp-sa

