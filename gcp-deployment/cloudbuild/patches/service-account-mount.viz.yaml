# Strategic-merge patch to mount the GCP service account JSON secret
# into the `viz` deployment.
spec:
  template:
    spec:
      containers:
        - name: viz
          env:
            - name: SERVICE_ACCOUNT
              value: "/var/secrets/gcp/service-account.json"
          volumeMounts:
            - name: gcp-sa
              mountPath: /var/secrets/gcp
              readOnly: true
      volumes:
        - name: gcp-sa
          secret:
            secretName: dust-gcp-sa
